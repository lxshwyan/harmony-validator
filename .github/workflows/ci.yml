name: Verify

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # DevEco/SDK is installed on the project owner's Mac runner.
    # Deliberately not triggered by pull_request: this is a public repository,
    # and untrusted PR code must never execute on a self-hosted workstation.
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test, build release HAR, and scan package
        run: ./scripts/verify.sh
